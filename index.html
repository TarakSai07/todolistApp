<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
       body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f06, #4a90e2);
            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }


        .container {
            width: 90%;
            max-width: 400px;
            padding: 25px;

            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }


        .input-box {
            display: flex;
            gap: 10px;
        }


        input {
            flex: 1;
            padding: 12px;

            border: none;
            border-radius: 8px;
            outline: none;

            font-size: 16px;
        }


        button {
            padding: 10px 15px;

            border: none;
            border-radius: 8px;

            background: #ff6b6b;
            color: white;

            cursor: pointer;
        }


        button:hover {
            background: #ff4757;
        }
      </style>
</head>
<body>
   <div class="container">

        <div class="input-box">

            <input
                type="text"
                id="input"
                placeholder="Add a new task..."
            >

            <button id="addBtn">
                Add
            </button>

        </div>


        <div id="taskList"></div>

    </div>
</body>
</html>
